<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/grid.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <title>Caution Signs</title>
</head>
    <body>
        <main>
            <section class="title-con">
                <h1 class="hidden">Responsive Caution Signs</h1>
            </section>
            <section id="img-con" class="container">
                <img src="images/caution-sign.jpg" alt="Caution Sign" height="500px" width="500px">
                <img src="images/explosive-sign.jpg" alt="Explosive Sign" height="500px" width="500px">
                <img src="images/radioactive-sign.jpg" alt="Radioactive Sign" height="500px" width="500px">
            </section>

            <section id="src-con" class="container">
                <img src="images/image1.jpg" alt="Image 1">
                <img src="images/image2.jpg" alt="Image 2">
                <img src="images/image3.jpg" alt="Image 3">
            </section>

            <section id="pic-con" class="container">
                <img src="images/image1.jpg" alt="Image 1">
                <img src="images/image2.jpg" alt="Image 2">
                <img src="images/image3.jpg" alt="Image 3">
            </section>
            
        </main>
        <script src="js/main.js"></script>   
    </body>
</html>
